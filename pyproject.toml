[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cairnshop-tests"
version = "0.1.0"
description = "API, UI and performance test automation for CairnShop"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "allure-pytest>=2.13",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pytest>=8.0",
    "requests>=2.31",
]

[project.optional-dependencies]
ui = ["pytest-playwright>=0.5"]
perf = ["locust>=2.29"]
dev = ["pytest-xdist>=3.5", "ruff>=0.5"]

[tool.setuptools]
packages = ["api", "config", "data"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
